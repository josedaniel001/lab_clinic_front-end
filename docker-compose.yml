version: '3.8'

services:
  lab-clinic-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lab-clinic-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
      - HOSTNAME=0.0.0.0
    env_file:
      - env.development
    restart: unless-stopped
    networks:
      - lab-clinic-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "https://bioanalisisadmin.com/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Base de datos PostgreSQL (opcional - descomenta si necesitas una base de datos)
